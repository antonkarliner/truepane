<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e07828"/>
      <stop offset="100%" stop-color="#8840b8"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#18141c"/>
  <!-- Left strip: warm cream -->
  <rect x="4" y="8" width="5.5" height="16" rx="1.6" fill="#f0e4cc"/>
  <!-- Middle strip: gradient, taller — focal point -->
  <rect x="13.25" y="6" width="5.5" height="20" rx="1.6" fill="url(#g)"/>
  <!-- Right strip: deep lavender -->
  <rect x="22.5" y="8" width="5.5" height="16" rx="1.6" fill="#7060a8"/>
  <!-- Camera dots -->
  <circle cx="6.75" cy="10.2" r="0.75" fill="#18141c" opacity="0.45"/>
  <circle cx="16" cy="8.2" r="0.75" fill="#18141c" opacity="0.45"/>
  <circle cx="25.25" cy="10.2" r="0.75" fill="#18141c" opacity="0.45"/>
</svg>
